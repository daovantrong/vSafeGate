# =========================================================================
# vSafeGate Custom Rules (Tự do tạo Rule không giới hạn)
# Sử dụng cú pháp SecLang (OWASP CRS / ModSecurity / Coraza tương thích 100%)
# =========================================================================

# 1. Bật WAF Engine
SecRuleEngine On

# 2. Tùy chỉnh thông báo và trang phản hồi khi bị chặn
SecDefaultAction "phase:2,deny,status:403,log,msg:'[vSafeGate Blocked] Access Denied'"

# -------------------------------------------------------------------------
# RULE 1001: Chặn truy cập trang nhạy cảm /admin hoặc /wp-login nếu không phải IP nội bộ
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/(admin|wp-admin|wp-login\.php|phpmyadmin)" \
    "id:1001,\
    phase:1,\
    deny,\
    status:403,\
    chain,\
    msg:'[vSafeGate] Unauthorized Admin Access Attempt',\
    log"
    SecRule REMOTE_ADDR "!@ipMatch 10.20.30.0/24,127.0.0.1,10.242.0.0/16"

# -------------------------------------------------------------------------
# RULE 1002: Chặn Scanner / Bot độc hại (sqlmap, nikto, acunetix, gobuster)
# -------------------------------------------------------------------------
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|acunetix|gobuster|dirbuster|nmap|masscan|wpscan)" \
    "id:1002,\
    phase:1,\
    deny,\
    status:403,\
    msg:'[vSafeGate] Security Scanner Detected',\
    log"

# -------------------------------------------------------------------------
# RULE 1003: Chặn SQL Injection mẫu cơ bản trong query string
# -------------------------------------------------------------------------
SecRule ARGS "@rx (?i)(\bunion\b.*\bselect\b|\bor\b\s+1=1|\bdrop\b\s+\btable\b|;\s*--)" \
    "id:1003,\
    phase:2,\
    deny,\
    status:403,\
    msg:'[vSafeGate] SQL Injection Pattern Detected',\
    log"

# -------------------------------------------------------------------------
# RULE 1004: Chặn XSS Injection cơ bản
# -------------------------------------------------------------------------
SecRule ARGS "@rx (?i)(<script[^>]*>|javascript:|onerror=|onload=)" \
    "id:1004,\
    phase:2,\
    deny,\
    status:403,\
    msg:'[vSafeGate] Cross-Site Scripting (XSS) Pattern Detected',\
    log"
