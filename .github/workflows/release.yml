name: Build and Release vSafeGate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to use v<VERSION>, e.g. v1.0.1)'
        required: false
        default: ''
      publish_release:
        description: 'Create/Update GitHub Release automatically'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go Environment (Pinned from go.mod)
        uses: actions/setup-go@v6
        with:
          go-version-file: 'mgt/go.mod'
          check-latest: true
          cache: false

      - name: Resolve Version & Release Tag
        id: meta
        run: |
          BASE_VER=$(tr -d '[:space:]' < VERSION || echo "1.0.1")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="v${BASE_VER}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG} (version: ${VER})"

      - name: Run Unit Tests (mgt & caddy-core with -race)
        run: |
          (cd mgt && go vet ./... && go test -race -count=1 -v ./...)
          (cd caddy-core && go vet -mod=vendor . ./modules/... && go test -mod=vendor -race -count=1 -v . ./modules/...)

      - name: Compile vSafeGate Binaries (amd64 & arm64)
        run: |
          mkdir -p dist
          VER="${{ steps.meta.outputs.version }}"
          cd mgt

          echo "Building vSafeGate v${VER} Linux amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.AppVersion=${VER}" -o ../dist/vsafegate-linux-amd64 .

          echo "Building vSafeGate v${VER} Linux arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.AppVersion=${VER}" -o ../dist/vsafegate-linux-arm64 .

      - name: Build Caddy + Coraza WAF Binaries (Vendored & Immutable)
        run: |
          cd caddy-core

          echo "Building Vendored Caddy + Coraza WAF Linux amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=vendor -ldflags="-s -w" -o ../dist/caddy-coraza-linux-amd64 .

          echo "Building Vendored Caddy + Coraza WAF Linux arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -mod=vendor -ldflags="-s -w" -o ../dist/caddy-coraza-linux-arm64 .

          cd ..
          chmod +x dist/*

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum vsafegate-* caddy-coraza-* > sha256sums.txt
          cat sha256sums.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ASSETS=(
            dist/vsafegate-linux-amd64
            dist/vsafegate-linux-arm64
            dist/caddy-coraza-linux-amd64
            dist/caddy-coraza-linux-arm64
            dist/sha256sums.txt
            install.sh
            VERSION
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release ${TAG}..."
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
          else
            echo "Creating new GitHub Release ${TAG}..."
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "vSafeGate ${TAG}" \
              --generate-notes \
              "${ASSETS[@]}"
          fi
