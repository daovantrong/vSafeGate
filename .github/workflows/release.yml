name: Build and Release vSafeGate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Unit Tests
        run: |
          cd mgt
          go test -v ./...

      - name: Compile vSafeGate Binaries (amd64 & arm64)
        run: |
          mkdir -p dist
          cd mgt

          echo "Building vSafeGate Linux amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/vsafegate-linux-amd64 .

          echo "Building vSafeGate Linux arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/vsafegate-linux-arm64 .

      - name: Build Caddy + Coraza WAF Binaries (amd64 & arm64)
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
          XCADDY_BIN="$(go env GOPATH)/bin/xcaddy"

          echo "Building Caddy + Coraza WAF Linux amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 "$XCADDY_BIN" build \
            --with github.com/corazawaf/coraza-caddy/v2 \
            --output dist/caddy-coraza-linux-amd64

          echo "Building Caddy + Coraza WAF Linux arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 "$XCADDY_BIN" build \
            --with github.com/corazawaf/coraza-caddy/v2 \
            --output dist/caddy-coraza-linux-arm64

          chmod +x dist/*

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum vsafegate-* caddy-coraza-* > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/vsafegate-linux-amd64
            dist/vsafegate-linux-arm64
            dist/caddy-coraza-linux-amd64
            dist/caddy-coraza-linux-arm64
            dist/sha256sums.txt
            install.sh
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
